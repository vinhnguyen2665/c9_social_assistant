[package]
name = "c9_social_assistant_app"
version = "1.0.0"
description = "C9 Social Assistant Desktop Client - Anti-Reversing & High-Performance Facebook Crawler"
authors = ["C9 Team"]
edition = "2021"

[lib]
name = "c9_social_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Anti-decompile & Anti-reversing Profile as specified in todo.md
[profile.release]
opt-level = "z"          # Optimize for binary size & dead-code elimination
lto = true               # Link-Time Optimization across all crates
codegen-units = 1        # Single codegen unit for maximum inter-procedural analysis
panic = "abort"          # Abort immediately on panic (removes stack unwind tables)
strip = true             # Strip symbols, debug info, and section headers

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "http2", "rustls-tls", "cookies"] }
rusqlite = { version = "0.31", features = ["bundled"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
obfstr = "0.4"
rand = "0.8"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
